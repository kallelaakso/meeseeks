<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <h1>Dashboard</h1>
    <p id="pr-checked-at"></p>
    <div id="needs-attention"></div>
    <div id="board"></div>
    <details>
      <summary>Archive</summary>
      <div id="archive"></div>
    </details>
    <div id="specs"></div>
    <div id="events"></div>
  </main>

  <dialog id="detail-modal">
    <article>
      <header>
        <button id="close-modal" aria-label="Close" class="close"></button>
        <h3 id="modal-title"></h3>
      </header>
      <div id="modal-body"></div>
    </article>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
  (() => {
    const markedLoaded = typeof marked !== 'undefined' && typeof marked.parse === 'function';

    const renderMarkdown = (text) => {
      if (markedLoaded) {
        return marked.parse(text);
      }
      return '<pre>' + text.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>';
    };

    const openModal = (title, body) => {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = body;
      document.getElementById('detail-modal').showModal();
    };

    document.getElementById('close-modal').addEventListener('click', () => {
      document.getElementById('detail-modal').close();
    });

    const fetchPlan = async (id) => {
      const res = await fetch(`/api/plan/${id}`);
      if (!res.ok) return;
      const data = await res.json();
      let body = renderMarkdown(data.raw_markdown);
      if (data.transitions && data.transitions.length) {
        body += '<h4>Transitions</h4><ul>';
        data.transitions.forEach(t => {
          body += `<li>${t.plan_id}: ${t.from_state || 'null'} → ${t.to_state} @ ${t.observed_at}</li>`;
        });
        body += '</ul>';
      }
      if (data.pr) {
        body += `<p>PR: <a href="${data.pr.url}" target="_blank">${data.pr.state}</a></p>`;
      }
      openModal(data.id, body);
    };

    const fetchSpec = async (filename) => {
      const res = await fetch(`/api/spec/${filename}`);
      if (!res.ok) return;
      const data = await res.json();
      let body = renderMarkdown(data.raw_markdown);
      body += `<p><strong>Status:</strong> <span class="badge spec-${data.status}">${data.status}</span></p>`;
      body += `<p><strong>Linked plans:</strong> ${data.linked_plan_ids.join(', ') || 'none'}</p>`;
      openModal(data.filename, body);
    };

    const renderCard = (plan) => {
      return `
        <div class="card">
          <h5><a href="#" class="plan-link" data-plan-id="${plan.id}">${plan.id}</a></h5>
          <p>${plan.spec ? `<a href="#" class="spec-link" data-spec="${plan.spec}">${plan.spec}</a>` : 'no spec'}</p>
          <p>depends-on: ${plan.depends_on.join(', ') || 'none'}</p>
          <p>${plan.time_in_state_seconds !== null ? `${Math.round(plan.time_in_state_seconds)}s` : ''}</p>
          ${plan.pr ? `<span class="badge pr-${plan.pr.state.toLowerCase()}"><a href="${plan.pr.url}" target="_blank">${plan.pr.state}</a></span>` : ''}
        </div>
      `;
    };

    const renderBoard = (data) => {
      const board = document.getElementById('board');
      const needs = document.getElementById('needs-attention');
      const archive = document.getElementById('archive');
      const specs = document.getElementById('specs');
      const events = document.getElementById('events');
      const prCheckedAt = document.getElementById('pr-checked-at');

      prCheckedAt.textContent = data.pr_checked_at ? `PR status as of ${data.pr_checked_at}` : '';

      const attention = (data.plans['awaiting-merge'] || []).filter(p => p.pr && p.pr.state === 'OPEN');
      if (attention.length) {
        needs.innerHTML = '<h2>Needs attention</h2>' + attention.map(p => `
          <div class="attention-item">
            <a href="${p.pr.url}" target="_blank">${p.id}</a> — PR is OPEN
          </div>
        `).join('');
      } else {
        needs.innerHTML = '';
      }

      const order = ['drafts', 'ready-for-work', 'in-progress', 'awaiting-merge', 'done'];
      const boardHtml = '<div class="board-grid">' + order.map(state => {
        const plans = data.plans[state] || [];
        return `
          <div class="column">
            <h3>${state}</h3>
            <div class="column-body">${plans.map(renderCard).join('')}</div>
          </div>
        `;
      }).join('') + '</div>';
      board.innerHTML = boardHtml;

      if (data.invalid && data.invalid.length) {
        const banner = document.createElement('div');
        banner.className = 'invalid-banner';
        banner.innerHTML = '<h2>Invalid plans</h2>' + data.invalid.map(i => `
          <div class="invalid-card">
            <span class="badge warning">invalid</span>
            ${i.filename} in ${i.state}: ${i.error}
          </div>
        `).join('');
        board.prepend(banner);
      }

      const archivePlans = [
        ...(data.plans['failed'] || []),
        ...(data.plans['closed'] || [])
      ];
      if (archivePlans.length) {
        archive.innerHTML = archivePlans.map(renderCard).join('');
      } else {
        archive.innerHTML = '<p>Nothing archived.</p>';
      }

      if (data.specs && data.specs.length) {
        specs.innerHTML = '<h2>Specs</h2><div class="spec-list">' + data.specs.map(s => `
          <div class="spec-card">
            <span class="badge spec-${s.status}">${s.status}</span>
            <a href="#" class="spec-link" data-spec="${s.filename}">${s.filename}</a>
            <small>linked: ${s.linked_plan_ids.join(', ') || 'none'}</small>
          </div>
        `).join('') + '</div>';
      } else {
        specs.innerHTML = '';
      }

      if (data.events && data.events.length) {
        events.innerHTML = '<h2>Activity</h2><ul>' + data.events.map(e => `
          <li>${e.plan_id}: ${e.from_state || 'null'} → ${e.to_state} @ ${e.observed_at}</li>
        `).join('') + '</ul>';
      } else {
        events.innerHTML = '';
      }
    };

    document.addEventListener('click', (e) => {
      const planLink = e.target.closest('.plan-link');
      if (planLink) {
        e.preventDefault();
        fetchPlan(planLink.dataset.planId);
        return;
      }
      const specLink = e.target.closest('.spec-link');
      if (specLink) {
        e.preventDefault();
        fetchSpec(specLink.dataset.spec);
        return;
      }
    });

    const poll = async () => {
      try {
        const [boardRes, eventsRes] = await Promise.all([
          fetch('/api/board'),
          fetch('/api/events?limit=20'),
        ]);
        if (boardRes.ok) {
          const boardData = await boardRes.json();
          const eventsData = eventsRes.ok ? await eventsRes.json() : [];
          renderBoard({ ...boardData, events: eventsData });
        }
      } catch (err) {
        console.error('poll error', err);
      }
    };

    poll();
    setInterval(poll, 5000);
  })();
  </script>
</body>
</html>
