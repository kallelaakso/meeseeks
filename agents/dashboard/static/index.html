<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <h1>Dashboard</h1>
    <p id="pr-checked-at"></p>
    <div id="needs-attention"></div>
    <div id="invalid"></div>
    <h2>State changes</h2>
    <table id="changes">
      <thead>
        <tr>
          <th>Time</th>
          <th>Plan</th>
          <th>Change</th>
          <th>Kind</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="specs"></div>
  </main>

  <dialog id="detail-modal">
    <article>
      <header>
        <button id="close-modal" aria-label="Close" class="close"></button>
        <h3 id="modal-title"></h3>
      </header>
      <div id="modal-body"></div>
    </article>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
  (() => {
    const markedLoaded = typeof marked !== 'undefined' && typeof marked.parse === 'function';

    const renderMarkdown = (text) => {
      if (markedLoaded) {
        return marked.parse(text);
      }
      return '<pre>' + text.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>';
    };

    const openModal = (title, body) => {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = body;
      document.getElementById('detail-modal').showModal();
    };

    document.getElementById('close-modal').addEventListener('click', () => {
      document.getElementById('detail-modal').close();
    });

    const fetchPlan = async (id) => {
      const res = await fetch(`/api/plan/${id}`);
      if (!res.ok) return;
      const data = await res.json();
      let body = renderMarkdown(data.raw_markdown);
      if (data.transitions && data.transitions.length) {
        body += '<h4>Transitions</h4><ul>';
        data.transitions.forEach(t => {
          body += `<li>${t.plan_id}: ${t.from_state || 'null'} → ${t.to_state} @ ${t.observed_at}</li>`;
        });
        body += '</ul>';
      }
      if (data.pr) {
        body += `<p>PR: <a href="${data.pr.url}" target="_blank">${data.pr.state}</a></p>`;
      }
      openModal(data.id, body);
    };

    const fetchSpec = async (filename) => {
      const res = await fetch(`/api/spec/${filename}`);
      if (!res.ok) return;
      const data = await res.json();
      let body = renderMarkdown(data.raw_markdown);
      body += `<p><strong>Status:</strong> <span class="badge spec-${data.status}">${data.status}</span></p>`;
      body += `<p><strong>Linked plans:</strong> ${data.linked_plan_ids.join(', ') || 'none'}</p>`;
      openModal(data.filename, body);
    };

    const kindOf = (t) => {
      if (t.is_baseline || t.from_state === null) return 'baseline';
      if (t.to_state === 'failed' || t.to_state === 'closed') return 'problem';
      if (t.to_state === 'awaiting-merge') return 'review';
      if (['drafts','ready-for-work','in-progress','done'].includes(t.to_state))
        return 'progress';
      return 'baseline';
    };

    const renderNeedsAttention = (plans, prCheckedAt) => {
      const el = document.getElementById('needs-attention');
      const prEl = document.getElementById('pr-checked-at');
      prEl.textContent = prCheckedAt ? `PR status as of ${prCheckedAt}` : '';
      const attention = (plans['awaiting-merge'] || []).filter(p => p.pr && p.pr.state === 'OPEN');
      if (attention.length) {
        el.innerHTML = '<h2>Needs attention</h2>' + attention.map(p => `
          <div class="attention-item">
            <a href="${p.pr.url}" target="_blank">${p.id}</a> — PR is OPEN
          </div>
        `).join('');
      } else {
        el.innerHTML = '';
      }
    };

    const renderInvalid = (invalids) => {
      const el = document.getElementById('invalid');
      if (invalids && invalids.length) {
        el.innerHTML = '<div class="invalid-banner"><h2>Invalid plans</h2>' + invalids.map(i => `
          <div class="invalid-card">
            <span class="badge warning">invalid</span>
            ${i.filename} in ${i.state}: ${i.error}
          </div>
        `).join('') + '</div>';
      } else {
        el.innerHTML = '';
      }
    };

    const renderSpecs = (specs) => {
      const el = document.getElementById('specs');
      if (specs && specs.length) {
        el.innerHTML = '<h2>Specs</h2><div class="spec-list">' + specs.map(s => `
          <div class="spec-card">
            <span class="badge spec-${s.status}">${s.status}</span>
            <a href="#" class="spec-link" data-spec="${s.filename}">${s.filename}</a>
            <small>linked: ${s.linked_plan_ids.join(', ') || 'none'}</small>
          </div>
        `).join('') + '</div>';
      } else {
        el.innerHTML = '';
      }
    };

    const renderChanges = (events) => {
      const tbody = document.querySelector('#changes tbody');
      if (!events || !events.length) {
        tbody.innerHTML = '<tr><td colspan="4">No state changes recorded yet.</td></tr>';
        return;
      }
      tbody.innerHTML = events.map(t => {
        const kind = kindOf(t);
        const time = new Date(t.observed_at).toLocaleString();
        return `
          <tr>
            <td title="${t.observed_at}">${time}</td>
            <td><a href="#" class="plan-link" data-plan-id="${t.plan_id}">${t.plan_id}</a></td>
            <td>${t.from_state ?? '—'} → ${t.to_state}</td>
            <td><span class="badge kind-${kind}">${kind}</span></td>
          </tr>
        `;
      }).join('');
    };

    document.addEventListener('click', (e) => {
      const planLink = e.target.closest('.plan-link');
      if (planLink) {
        e.preventDefault();
        fetchPlan(planLink.dataset.planId);
        return;
      }
      const specLink = e.target.closest('.spec-link');
      if (specLink) {
        e.preventDefault();
        fetchSpec(specLink.dataset.spec);
        return;
      }
    });

    const poll = async () => {
      try {
        const [boardRes, eventsRes] = await Promise.all([
          fetch('/api/board'),
          fetch('/api/events'),
        ]);
        if (boardRes.ok) {
          const boardData = await boardRes.json();
          const eventsData = eventsRes.ok ? await eventsRes.json() : [];
          renderNeedsAttention(boardData.plans, boardData.pr_checked_at);
          renderInvalid(boardData.invalid);
          renderChanges(eventsData);
          renderSpecs(boardData.specs);
        }
      } catch (err) {
        console.error('poll error', err);
      }
    };

    poll();
    setInterval(poll, 5000);
  })();
  </script>
</body>
</html>
